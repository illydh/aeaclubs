name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build-only check on PRs; deploy runs only from main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Prerenders every route into dist/client, served under /aeaclubs/ (see vite.config.ts).
      - run: bun run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
